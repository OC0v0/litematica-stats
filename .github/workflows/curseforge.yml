name: Upload to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing the jars
        required: true
        default: v1.0.1

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download release jars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          mkdir -p jars
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "*.jar" --dir jars
          ls -la jars

      - name: Upload to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: "1800138"
        run: |
          set -euo pipefail
          CHANGELOG=$'- Fixed the scrollbar becoming unusably small on very long lists\n- Improved performance: faster schematic scanning and smoother scrolling'
          for f in jars/*.jar; do
            file=$(basename "$f")
            mc=$(echo "$file" | sed -E 's/^litematica-stats-([0-9]+\.[0-9]+(\.[0-9]+)?)-[0-9]+\.[0-9]+\.[0-9]+\.jar$/\1/')
            echo "Uploading $file for Minecraft $mc"
            jq -n \
              --arg dn "$file" \
              --arg mc "$mc" \
              --arg cl "$CHANGELOG" \
              '{changelog:$cl, changelogType:"markdown", displayName:$dn, releaseType:"release", gameVersions:[$mc,"Fabric"], relations:{projects:[{id:308892,type:"requiredDependency"},{id:303119,type:"requiredDependency"},{id:297344,type:"optionalDependency"}]}}' \
              > metadata.json
            curl -sS --fail-with-body --max-time 300 \
              -H "X-Api-Token: $CF_API_TOKEN" \
              -F "metadata=<metadata.json;type=application/json" \
              -F "file=@$f" \
              "https://minecraft.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file"
            echo
          done
